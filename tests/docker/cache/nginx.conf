# Reverse proxy cache in front of the `wp` service, standing in for a real
# CDN/host cache. We deliberately IGNORE WordPress's own Cache-Control /
# Expires values for the purpose of computing a TTL (proxy_ignore_headers)
# so ordinary pages get cached for cache-version.spec.mjs and
# shared-cache.spec.mjs, but $trackwp_no_store below still inspects the
# ORIGINAL Cache-Control header and refuses to cache anything carrying
# no-store or private -- which is exactly what
# TrackWP_WooCommerce sets via nocache_headers()/DONOTCACHEPAGE on the
# order-received page per K5.

proxy_cache_path /var/cache/nginx/trackwp levels=1:2 keys_zone=trackwp_cache:10m max_size=200m inactive=60m use_temp_path=off;

map $upstream_http_cache_control $trackwp_no_store {
    default      0;
    "~*no-store" 1;
    "~*private"  1;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://wp:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache trackwp_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 301 302 10m;

        proxy_ignore_headers Cache-Control Expires;
        proxy_no_cache $trackwp_no_store;
        proxy_cache_bypass $trackwp_no_store;

        add_header X-TrackWP-Cache $upstream_cache_status always;
    }
}
