name: trackwp-tests

services:
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress_test
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/trackwp-init.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      # mariadb:11 (Ubuntu-based image) ships mariadb-admin, not mysqladmin.
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs:
      - /tmp

  mockplatforms:
    build: ./mockplatforms
    ports:
      - "8090:8090"

  # PHPUnit against WordPress 7.1 + WooCommerce 11, HPOS ON.
  phpunit:
    build: ./php
    depends_on:
      db:
        condition: service_healthy
    environment:
      WP_VERSION: "7.1"
      WC_VERSION: "11.0.0"
      WP_TESTS_DB_HOST: db
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_NAME: wordpress_test
      WP_CORE_DIR: /tmp/wordpress-core-71
      TRACKWP_TEST_HPOS: "1"
    volumes:
      - ../..:/workspace
      - wp-core-71:/tmp/wordpress-core-71
    working_dir: /workspace

  # Same suite, HPOS OFF, `--group orders` only (K5 storage-backend parity,
  # see test-woocommerce-purchase.php owned by W4). Shares the wp-core-71
  # volume with `phpunit` (same WP+WC files, different database).
  phpunit-legacy-orders:
    build: ./php
    depends_on:
      db:
        condition: service_healthy
    environment:
      WP_VERSION: "7.1"
      WC_VERSION: "11.0.0"
      WP_TESTS_DB_HOST: db
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_NAME: wordpress_test_legacy
      WP_CORE_DIR: /tmp/wordpress-core-71
      TRACKWP_TEST_HPOS: "0"
    volumes:
      - ../..:/workspace
      - wp-core-71:/tmp/wordpress-core-71
    working_dir: /workspace

  # A real, running WordPress 7.1 + WooCommerce 11 site for Playwright.
  wp:
    build: ./wp
    depends_on:
      db:
        condition: service_healthy
      mockplatforms:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress71
      WP_SITE_URL: http://wp
      WP_VERSION: "7.1"
      WC_VERSION: "11.0.0"
      WC_HPOS: "yes"
      TRACKWP_WP_ADMIN_USER: admin
      TRACKWP_WP_ADMIN_PASSWORD: admin
      # Consumed by tests/docker/wp/mu-plugins/trackwp-test-endpoints.php
      # (X-TrackWP-Test-Token header check). Test-only, not a real secret.
      TRACKWP_TEST_TOKEN: trackwp-e2e-test-token
      # Consumed by tests/docker/wp/mu-plugins/trackwp-test-mockplatforms.php.
      WORDPRESS_CONFIG_EXTRA: "define('TRACKWP_MOCKPLATFORMS_URL', 'http://mockplatforms:8090');"
    volumes:
      - ../..:/plugin-src:ro
      - ./wp/mu-plugins:/mu-plugins:ro
      - wp-app-71:/var/www/html
    ports:
      - "8080:80"

  # WordPress 6.2 for the strategy-fallback spec (defer-strategy enqueue
  # only exists from WP 6.3; K8/2.4). WooCommerce 8.0.0 is the newest
  # release whose readme still declares "Requires at least: 6.2" (verified
  # 2026-09-27 against https://plugins.svn.wordpress.org/woocommerce/tags/8.0.0/readme.txt
  # -- "Requires at least: 6.2", "Tested up to: 6.3", "Requires PHP: 7.3";
  # WooCommerce 8.1.0+ raises the floor to WP 6.3). Any scenario test that
  # needs WooCommerce on the 6.2 service must run against this version.
  wp62:
    build: ./wp
    depends_on:
      db:
        condition: service_healthy
      mockplatforms:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress62
      WP_SITE_URL: http://wp62
      WP_VERSION: "6.2"
      WC_VERSION: "8.0.0"
      TRACKWP_WP_ADMIN_USER: admin
      TRACKWP_WP_ADMIN_PASSWORD: admin
      TRACKWP_TEST_TOKEN: trackwp-e2e-test-token
      WORDPRESS_CONFIG_EXTRA: "define('TRACKWP_MOCKPLATFORMS_URL', 'http://mockplatforms:8090');"
    volumes:
      - ../..:/plugin-src:ro
      - ./wp/mu-plugins:/mu-plugins:ro
      - wp-app-62:/var/www/html
    ports:
      - "8082:80"

  # nginx proxy_cache in front of `wp`, used by cache-version.spec.mjs and
  # shared-cache.spec.mjs (see cache/nginx.conf).
  cache:
    image: nginx:alpine
    depends_on:
      - wp
    volumes:
      - ./cache/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"

  e2e:
    build: ./e2e
    depends_on:
      - wp
      - cache
      - mockplatforms
    environment:
      TRACKWP_E2E_BASE_URL: http://wp
      TRACKWP_CACHE_BASE_URL: http://cache
      TRACKWP_MOCKPLATFORMS_URL: http://mockplatforms:8090
      TRACKWP_WP_ADMIN_USER: admin
      TRACKWP_WP_ADMIN_PASSWORD: admin
      TRACKWP_TEST_TOKEN: trackwp-e2e-test-token
    volumes:
      - ../..:/workspace
      - e2e-node-modules:/workspace/node_modules
    working_dir: /workspace

  e2e-wp62:
    build: ./e2e
    depends_on:
      - wp62
      - mockplatforms
    environment:
      TRACKWP_E2E_BASE_URL: http://wp62
      TRACKWP_MOCKPLATFORMS_URL: http://mockplatforms:8090
      TRACKWP_WP_ADMIN_USER: admin
      TRACKWP_WP_ADMIN_PASSWORD: admin
      TRACKWP_TEST_TOKEN: trackwp-e2e-test-token
    volumes:
      - ../..:/workspace
      - e2e-node-modules:/workspace/node_modules
    working_dir: /workspace
    command: ["npx", "playwright", "test", "tests/e2e/strategy-fallback.spec.mjs"]

volumes:
  db-data:
  wp-core-71:
  wp-app-71:
  wp-app-62:
  e2e-node-modules:
